[package]
name = "c4rizer-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "c4rizer-editor"
path = "src/main.rs"

[dependencies]
# EDIT-7: PNG export in phase 1 [resvg approved 2026-11-15]; P2-663
# `outline` SVG text (phase2-decisions A.2 Cargo, Part C sign-off).
c4rizer-core = { path = "../core", features = ["png", "outline"] }
# HLD §2: window, canvas, input (egui) [delegated].
eframe = "0.37"
# HLD §2: directory watching for EDIT-1, EDIT-23 [approved 2026-11-15].
notify = "8.2"
# HLD §2: native Open and Save dialogs for EDIT-13, EDIT-7 [approved 2026-11-15].
rfd = "0.18"
# P3-514 (ruling X1): Markdown in the documentation viewer.
pulldown-cmark = { version = "0.13", default-features = false }

[lints]
workspace = true
