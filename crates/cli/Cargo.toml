[package]
name = "c4rizer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "c4rizer"
path = "src/main.rs"

[features]
# CLI-4: `--png` needs core's PNG export; without it `--png` exits 2.
png = ["c4rizer-core/png"]

[dependencies]
c4rizer-core = { path = "../core" }

[lints]
workspace = true
