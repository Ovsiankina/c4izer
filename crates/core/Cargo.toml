[package]
name = "c4rizer-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# EXP-2: PNG through resvg, bundled font only, so no system-fonts or
# memmap-fonts. raster-images draws PNG/JPEG icons (P2-409) and image
# views (P2-320); owner sign-off O10, phase2-decisions Part C.
png = ["dep:resvg"]

[dependencies]
resvg = { version = "0.50", optional = true, default-features = false, features = ["text", "raster-images"] }

[lints]
workspace = true
