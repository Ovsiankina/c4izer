        description: "HTTPS"
        color: "#444444"

  - name: Dynamic: System - App
    sequence:
      start: "1"
      steps:
      - to: "4"
        label: "1. Submits a form"
        description: "HTTPS"
        color: "#444444"

      - to: "5"
        label: "2. Validates the form"
        color: "#444444"

      - to: "6"
        label: "3. Checks the record"
        description: "SQL"
        color: "#444444"

  - name: Dynamic: 
    sequence:
      start: "1"
      steps:
      - to: "2"
        label: "1. Sends a request"
        description: "HTTPS"
        color: "#444444"

      - to: "7"
        label: "2. Looks up data"
        description: "HTTPS"
        color: "#444444"
