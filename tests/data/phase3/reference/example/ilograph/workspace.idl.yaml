resources:
  - id: "1"
    name: "Worker"
    subtitle: "[Person]"
    description: "The one person whose tasks are tracked. Sees own tasks and debts, marks debts as sent."
    backgroundColor: "#0b3c6f"
    color: "#ffffff"

  - id: "2"
    name: "Witness"
    subtitle: "[Person]"
    description: "Accountability partner. Sees late tasks, claims debts, marks them received."
    backgroundColor: "#0b3c6f"
    color: "#ffffff"

  - id: "3"
    name: "Admin witness"
    subtitle: "[Person]"
    description: "Maintainer. Troubleshoots the witness view on fake data."
    backgroundColor: "#0b3c6f"
    color: "#ffffff"

  - id: "4"
    name: "Vikunja"
    subtitle: "[Software System]"
    description: "Existing task manager. Source of tasks and deadlines. Never modified."
    backgroundColor: "#5d5a6b"
    color: "#ffffff"

  - id: "5"
    name: "Push services"
    subtitle: "[Software System]"
    description: "Browser vendors' endpoints that deliver notifications to installed apps."
    backgroundColor: "#5d5a6b"
    color: "#ffffff"

  - id: "6"
    name: "Mail server"
    subtitle: "[Software System]"
    description: "Delivers invite and password-reset emails."
    backgroundColor: "#5d5a6b"
    color: "#ffffff"

  - id: "7"
    name: "Atomanja"
    subtitle: "[Software System]"
    description: "Records task deadlines, turns missed ones into debts, and tracks their settlement."
    backgroundColor: "#1565c0"
    color: "#ffffff"

    children:
      - id: "20"
        name: "Ledger database"
        subtitle: "[Container: SQLite file]"
        description: "Append-only record of deadlines, debts, claims, marks and accounts."
        backgroundColor: "#00796b"
        color: "#ffffff"

      - id: "21"
        name: "Dev database"
        subtitle: "[Container: SQLite file]"
        description: "Fake tasks and debts for the admin witness. Isolated from the real ledger."
        backgroundColor: "#00796b"
        color: "#ffffff"

      - id: "8"
        name: "Atomanja server"
        subtitle: "[Container: Rust, axum, HTML + htmx]"
        description: "Single binary. Polls Vikunja, keeps the ledger, serves both views, sends notifications and emails."
        backgroundColor: "#1e88e5"
        color: "#ffffff"

        children:
          - id: "10"
            name: "web"
            subtitle: "[Component: Rust, axum, htmx]"
            description: "HTTP layer: both views, login flows, debt actions, push subscription."
            backgroundColor: "#c2410c"
            color: "#ffffff"

          - id: "11"
            name: "sync"
            subtitle: "[Component: Rust, tokio]"
            description: "Poll loop: fetch, apply to ledger, persist, notify."
            backgroundColor: "#c2410c"
            color: "#ffffff"

          - id: "12"
            name: "devdata"
            subtitle: "[Component: Rust module]"
            description: "Fills the dev database with fake data through the real ledger rules."
            backgroundColor: "#c2410c"
            color: "#ffffff"

          - id: "13"
            name: "ledger"
            subtitle: "[Component: Rust module]"
            description: "Pure domain rules: deadlines, met or late, debts, claims, marks, amount."
            backgroundColor: "#2e7d32"
            color: "#ffffff"

          - id: "14"
            name: "auth"
            subtitle: "[Component: Rust module]"
            description: "Pure account rules: roles, password hashing, tokens, permission checks."
            backgroundColor: "#2e7d32"
            color: "#ffffff"

          - id: "15"
            name: "config"
            subtitle: "[Component: Rust module]"
            description: "Loads every setting from environment variables at startup."
            backgroundColor: "#2e7d32"
            color: "#ffffff"

          - id: "16"
            name: "vikunja"
            subtitle: "[Component: Rust, HTTP client]"
            description: "Read-only Vikunja client. Maps tasks to snapshot records."
            backgroundColor: "#1e88e5"
            color: "#ffffff"

          - id: "17"
            name: "notify"
            subtitle: "[Component: Rust, Web Push]"
            description: "Turns ledger changes into push notifications. Owns the push keys."
            backgroundColor: "#1e88e5"
            color: "#ffffff"

          - id: "18"
            name: "mail"
            subtitle: "[Component: Rust, SMTP client]"
            description: "Sends invite and password-reset emails."
            backgroundColor: "#1e88e5"
            color: "#ffffff"

          - id: "19"
            name: "store"
            subtitle: "[Component: Rust, SQLite]"
            description: "Persistence for ledger and dev databases. Ledger is insert-only."
            backgroundColor: "#1e88e5"
            color: "#ffffff"

          - id: "9"
            name: "cli"
            subtitle: "[Component: Rust binary]"
            description: "Command line: serve, create accounts, generate push keys, seed dev data."
            backgroundColor: "#c2410c"
            color: "#ffffff"

