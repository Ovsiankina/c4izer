<g class="box"><rect x="950" y="140" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08" stroke-width="1"/><text x="1050" y="173" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">cli</text><text x="1050" y="188" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust binary]</text><text x="1050" y="208" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Command line: serve, create</text><text x="1050" y="222" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">accounts, generate push keys,</text><text x="1050" y="236" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">seed dev data.</text></g>
<g class="box"><rect x="780" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08" stroke-width="1"/><text x="880" y="453" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">web</text><text x="880" y="468" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, axum, htmx]</text><text x="880" y="488" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">HTTP layer: both views, login</text><text x="880" y="502" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">flows, debt actions, push</text><text x="880" y="516" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">subscription.</text></g>
<g class="box"><rect x="100" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08" stroke-width="1"/><text x="200" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">sync</text><text x="200" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, tokio]</text><text x="200" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Poll loop: fetch, apply to ledger,</text><text x="200" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">persist, notify.</text></g>
<g class="box"><rect x="1800" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08" stroke-width="1"/><text x="1900" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">devdata</text><text x="1900" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust module]</text><text x="1900" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Fills the dev database with fake</text><text x="1900" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">data through the real ledger rules.</text></g>
<g class="box"><rect x="1800" y="700" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24" stroke-width="1"/><text x="1900" y="733" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ledger</text><text x="1900" y="748" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust module]</text><text x="1900" y="768" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Pure domain rules: deadlines, met</text><text x="1900" y="782" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">or late, debts, claims, marks,</text><text x="1900" y="796" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">amount.</text></g>
<g class="box"><rect x="1120" y="420" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24" stroke-width="1"/><text x="1220" y="453" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">auth</text><text x="1220" y="468" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust module]</text><text x="1220" y="488" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Pure account rules: roles,</text><text x="1220" y="502" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">password hashing, tokens,</text><text x="1220" y="516" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">permission checks.</text></g>
<g class="box"><rect x="440" y="700" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24" stroke-width="1"/><text x="540" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">config</text><text x="540" y="755" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust module]</text><text x="540" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Loads every setting from</text><text x="540" y="789" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">environment variables at startup.</text></g>
<g class="box"><rect x="100" y="700" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="200" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">vikunja</text><text x="200" y="755" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, HTTP client]</text><text x="200" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Read-only Vikunja client. Maps</text><text x="200" y="789" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tasks to snapshot records.</text></g>
<g class="box"><rect x="440" y="420" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="540" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">notify</text><text x="540" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, Web Push]</text><text x="540" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Turns ledger changes into push</text><text x="540" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">notifications. Owns the push keys.</text></g>
<g class="box"><rect x="780" y="700" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="880" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">mail</text><text x="880" y="755" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, SMTP client]</text><text x="880" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Sends invite and password-reset</text><text x="880" y="789" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">emails.</text></g>
<g class="box"><rect x="1460" y="420" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="1560" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">store</text><text x="1560" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Component: Rust, SQLite]</text><text x="1560" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Persistence for ledger and dev</text><text x="1560" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">databases. Ledger is insert-only.</text></g>
<g class="label"><rect x="944" y="324" width="73" height="32" fill="#ffffff"/><text x="980" y="337" font-family="Inter, sans-serif" font-size="11" fill="#782807" text-anchor="middle">Starts HTTP</text><text x="980" y="350" font-family="Inter, sans-serif" font-size="11" fill="#782807" text-anchor="middle">server</text></g>
<g class="label"><rect x="606" y="391" width="88" height="19" fill="#ffffff"/><text x="650" y="404" font-family="Inter, sans-serif" font-size="11" fill="#782807" text-anchor="middle">Starts poll loop</text></g>
<g class="label"><rect x="1410" y="391" width="81" height="19" fill="#ffffff"/><text x="1450" y="404" font-family="Inter, sans-serif" font-size="11" fill="#782807" text-anchor="middle">Runs seeding</text></g>
<g class="label"><rect x="1150" y="224" width="101" height="32" fill="#ffffff"/><text x="1200" y="237" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">Opens databases</text><text x="1200" y="250" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">with</text></g>
<g class="label"><rect x="1069" y="324" width="102" height="32" fill="#ffffff"/><text x="1120" y="337" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Creates accounts</text><text x="1120" y="350" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">with</text></g>
<g class="label"><rect x="854" y="224" width="93" height="32" fill="#ffffff"/><text x="900" y="237" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">Generates push</text><text x="900" y="250" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">keys with</text></g>
<g class="label"><rect x="637" y="584" width="87" height="32" fill="#ffffff"/><text x="680" y="597" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Reads settings</text><text x="680" y="610" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">from</text></g>
<g class="label"><rect x="357" y="584" width="87" height="32" fill="#ffffff"/><text x="400" y="597" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Reads settings</text><text x="400" y="610" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">from</text></g>
<g class="label"><rect x="1866" y="604" width="68" height="32" fill="#ffffff"/><text x="1900" y="617" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Builds fake</text><text x="1900" y="630" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">debts with</text></g>
<g class="label"><rect x="1519" y="544" width="83" height="32" fill="#ffffff"/><text x="1560" y="557" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Builds fake</text><text x="1560" y="570" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">accounts with</text></g>
<g class="label"><rect x="1684" y="464" width="92" height="32" fill="#ffffff"/><text x="1730" y="477" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">Writes dev data</text><text x="1730" y="490" font-family="Inter, sans-serif" font-size="11" fill="#12548d" text-anchor="middle">through</text></g>
<g class="label"><rect x="327" y="744" width="87" height="32" fill="#ffffff"/><text x="370" y="757" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Reads settings</text><text x="370" y="770" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">from</text></g>
<g class="label"><rect x="497" y="604" width="87" height="32" fill="#ffffff"/><text x="540" y="617" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Reads settings</text><text x="540" y="630" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">from</text></g>
<g class="label"><rect x="667" y="744" width="87" height="32" fill="#ffffff"/><text x="710" y="757" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">Reads settings</text><text x="710" y="770" font-family="Inter, sans-serif" font-size="11" fill="#1c4d1f" text-anchor="middle">from</text></g>
<g class="title"><text x="60" y="907" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="start">Component diagram for the Atomanja server: startup, settings and dev data</text></g>
<g class="subtitle"><text x="60" y="924" font-family="Inter, sans-serif" font-size="12" fill="#555555" text-anchor="start">What cli starts, who reads config, and what devdata seeds. Only lines touching those three are drawn here.</text></g>
