<g class="box"><rect x="420" y="170" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="520" cy="164" r="26.5" fill="#ffffff"/><circle cx="520" cy="164" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="520" y="227" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Worker</text><text x="520" y="242" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="520" y="262" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">The one person whose tasks are</text><text x="520" y="276" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tracked. Sees own tasks and</text><text x="520" y="290" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, marks debts as sent.</text></g>
<g class="box"><rect x="700" y="170" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="800" cy="164" r="26.5" fill="#ffffff"/><circle cx="800" cy="164" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="800" y="227" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Witness</text><text x="800" y="242" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="800" y="262" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Accountability partner. Sees late</text><text x="800" y="276" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tasks, claims debts, marks them</text><text x="800" y="290" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">received.</text></g>
<g class="box"><rect x="980" y="170" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="1080" cy="164" r="26.5" fill="#ffffff"/><circle cx="1080" cy="164" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="1080" y="234" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Admin witness</text><text x="1080" y="249" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="1080" y="269" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Maintainer. Troubleshoots the</text><text x="1080" y="283" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">witness view on fake data.</text></g>
<g class="box"><rect x="50" y="710" width="200" height="140" rx="6" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="150" y="753" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Vikunja</text><text x="150" y="768" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[External Software System]</text><text x="150" y="788" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Existing task manager. Source of</text><text x="150" y="802" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tasks and deadlines. Never</text><text x="150" y="816" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">modified.</text></g>
<g class="box"><rect x="50" y="160" width="200" height="140" rx="6" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="150" y="203" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Push services</text><text x="150" y="218" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[External Software System]</text><text x="150" y="238" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Browser vendors&apos; endpoints that</text><text x="150" y="252" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">deliver notifications to installed</text><text x="150" y="266" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">apps.</text></g>
<g class="box"><rect x="1300" y="710" width="220" height="140" rx="6" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="1410" y="760" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Mail server</text><text x="1410" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[External Software System]</text><text x="1410" y="795" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Delivers invite and password-reset</text><text x="1410" y="809" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">emails.</text></g>
<g class="box"><rect x="580" y="470" width="440" height="140" rx="6" fill="#1e88e5" stroke="#1561a4" stroke-width="1"/><text x="800" y="520" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Atomanja server</text><text x="800" y="535" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: Rust, axum, HTML + htmx]</text><text x="800" y="555" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Single binary. Polls Vikunja, keeps the ledger, serves both views, sends</text><text x="800" y="569" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">notifications and emails.</text></g>
<g class="box"><path d="M560,719 A100,9 0 0 1 760,719 L760,841 A100,9 0 0 1 560,841 Z" fill="#00796b" stroke="#00574d" stroke-width="1"/><path d="M560,719 A100,9 0 0 0 760,719" fill="none" stroke="#73b5ae" stroke-width="1"/><text x="660" y="757" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Ledger database</text><text x="660" y="772" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: SQLite file]</text><text x="660" y="792" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Append-only record of deadlines,</text><text x="660" y="806" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, claims, marks and</text><text x="660" y="820" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">accounts.</text></g>
<g class="box"><path d="M840,719 A100,9 0 0 1 1040,719 L1040,841 A100,9 0 0 1 840,841 Z" fill="#00796b" stroke="#00574d" stroke-width="1"/><path d="M840,719 A100,9 0 0 0 1040,719" fill="none" stroke="#73b5ae" stroke-width="1"/><text x="940" y="757" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Dev database</text><text x="940" y="772" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Container: SQLite file]</text><text x="940" y="792" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Fake tasks and debts for the</text><text x="940" y="806" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">admin witness. Isolated from the</text><text x="940" y="820" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">real ledger.</text></g>
<g class="label"><rect x="534" y="360" width="133" height="60" rx="3" fill="#ffffff"/><text x="600" y="374" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Views tasks and debts,</text><text x="600" y="387" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">marks debts sent,</text><text x="600" y="400" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">invites witnesses</text><text x="600" y="413" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS]</text></g>
<g class="label"><rect x="732" y="360" width="136" height="60" rx="3" fill="#ffffff"/><text x="800" y="374" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Views late tasks, claims</text><text x="800" y="387" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">debts, marks debts</text><text x="800" y="400" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">received</text><text x="800" y="413" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS]</text></g>
<g class="label"><rect x="939" y="360" width="122" height="60" rx="3" fill="#ffffff"/><text x="1000" y="374" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Troubleshoots the</text><text x="1000" y="387" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">witness view on fake</text><text x="1000" y="400" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">data</text><text x="1000" y="413" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS]</text></g>
<g class="label"><rect x="341" y="587" width="119" height="47" rx="3" fill="#ffffff"/><text x="400" y="601" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Polls tasks and</text><text x="400" y="614" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">deadlines, read-only</text><text x="400" y="627" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[HTTPS/JSON]</text></g>
<g class="label"><rect x="614" y="637" width="152" height="47" rx="3" fill="#ffffff"/><text x="690" y="651" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Reads and appends ledger</text><text x="690" y="664" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">entries</text><text x="690" y="677" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[SQL]</text></g>
<g class="label"><rect x="843" y="637" width="134" height="47" rx="3" fill="#ffffff"/><text x="910" y="651" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Reads fake data for the</text><text x="910" y="664" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">admin witness</text><text x="910" y="677" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[SQL]</text></g>
<g class="label"><rect x="354" y="387" width="112" height="47" rx="3" fill="#ffffff"/><text x="410" y="401" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Sends notifications</text><text x="410" y="414" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">through</text><text x="410" y="427" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[Web Push]</text></g>
<g class="label"><rect x="1106" y="607" width="128" height="47" rx="3" fill="#ffffff"/><text x="1170" y="621" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Sends invite and reset</text><text x="1170" y="634" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">emails through</text><text x="1170" y="647" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="middle">[SMTP]</text></g>
<g class="label"><rect x="269" y="213" width="122" height="34" rx="3" fill="#ffffff"/><text x="330" y="227" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Delivers notifications</text><text x="330" y="240" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">to</text></g>
<g class="label"><rect x="459" y="73" width="122" height="34" rx="3" fill="#ffffff"/><text x="520" y="87" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Delivers notifications</text><text x="520" y="100" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">to</text></g>
<g class="title"><text x="50" y="921" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#14171a" text-anchor="start">Container diagram for Atomanja</text></g>
<g class="subtitle"><text x="50" y="936" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">The running parts of Atomanja and the technology each one uses.</text></g>
