<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 40 1080 914" width="1080" height="914" xml:space="preserve">
<rect x="80" y="40" width="1080" height="914" fill="#ffffff"/>
<g class="line"><path d="M320 240 L350 240 Q360 240 367.1 247.1 L492.9 372.9 Q500 380 500 390 L500 404" fill="none" stroke="#4a5a70" stroke-width="1.5" stroke-linejoin="round"/><path d="M500 410 L496.5 401 L500 403.5 L503.5 401 Z" fill="#4a5a70"/><circle cx="320" cy="240" r="2.5" fill="#ffffff" stroke="#4a5a70" stroke-width="1.5"/></g>
<g class="line"><path d="M620 260 L620 404" fill="none" stroke="#4a5a70" stroke-width="1.5" stroke-linejoin="round"/><path d="M620 410 L616.5 401 L620 403.5 L623.5 401 Z" fill="#4a5a70"/><circle cx="620" cy="260" r="2.5" fill="#ffffff" stroke="#4a5a70" stroke-width="1.5"/></g>
<g class="line"><path d="M920 240 L890 240 Q880 240 872.9 247.1 L747.1 372.9 Q740 380 740 390 L740 404" fill="none" stroke="#4a5a70" stroke-width="1.5" stroke-linejoin="round"/><path d="M740 410 L736.5 401 L740 403.5 L743.5 401 Z" fill="#4a5a70"/><circle cx="920" cy="240" r="2.5" fill="#ffffff" stroke="#4a5a70" stroke-width="1.5"/></g>
<g class="line"><path d="M620 550 L620 684" fill="none" stroke="#4a5a70" stroke-width="1.5" stroke-linejoin="round"/><path d="M620 690 L616.5 681 L620 683.5 L623.5 681 Z" fill="#4a5a70"/><circle cx="620" cy="550" r="2.5" fill="#ffffff" stroke="#4a5a70" stroke-width="1.5"/></g>
<g class="box"><rect x="120" y="110" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="220" cy="104" r="26.5" fill="#ffffff"/><circle cx="220" cy="104" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="220" y="167" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Worker</text><text x="220" y="182" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="220" y="202" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">The one person whose tasks are</text><text x="220" y="216" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tracked. Sees own tasks and</text><text x="220" y="230" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, marks debts as sent.</text></g>
<g class="box"><rect x="520" y="110" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="620" cy="104" r="26.5" fill="#ffffff"/><circle cx="620" cy="104" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="620" y="167" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Witness</text><text x="620" y="182" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="620" y="202" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Accountability partner. Sees late</text><text x="620" y="216" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tasks, claims debts, marks them</text><text x="620" y="230" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">received.</text></g>
<g class="box"><rect x="920" y="110" width="200" height="150" rx="14" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="1020" cy="104" r="26.5" fill="#ffffff"/><circle cx="1020" cy="104" r="24" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="1020" y="174" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Admin witness</text><text x="1020" y="189" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="1020" y="209" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Maintainer. Troubleshoots the</text><text x="1020" y="223" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">witness view on fake data.</text></g>
<g class="box"><rect x="500" y="690" width="240" height="140" rx="6" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="620" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Vikunja</text><text x="620" y="755" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[External Software System]</text><text x="620" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Existing task manager. Source of tasks</text><text x="620" y="789" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">and deadlines. Never modified.</text></g>
<g class="box"><rect x="480" y="410" width="280" height="140" rx="6" fill="#1565c0" stroke="#0f488a" stroke-width="1"/><text x="620" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Atomanja</text><text x="620" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Software System]</text><text x="620" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Records task deadlines, turns missed ones into</text><text x="620" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, and tracks their settlement.</text></g>
<g class="label"><rect x="364" y="287" width="133" height="47" rx="3" fill="#ffffff"/><text x="430" y="301" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Views tasks and debts,</text><text x="430" y="314" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">marks debts sent,</text><text x="430" y="327" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">invites witnesses</text></g>
<g class="label"><rect x="552" y="307" width="136" height="47" rx="3" fill="#ffffff"/><text x="620" y="321" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Views late tasks, claims</text><text x="620" y="334" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">debts, marks debts</text><text x="620" y="347" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">received</text></g>
<g class="label"><rect x="749" y="287" width="122" height="47" rx="3" fill="#ffffff"/><text x="810" y="301" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Troubleshoots the</text><text x="810" y="314" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">witness view on fake</text><text x="810" y="327" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">data</text></g>
<g class="label"><rect x="561" y="603" width="119" height="34" rx="3" fill="#ffffff"/><text x="620" y="617" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">Polls tasks and</text><text x="620" y="630" font-family="Inter, sans-serif" font-size="11" fill="#14171a" text-anchor="middle">deadlines, read-only</text></g>
<g class="title"><text x="120" y="861" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#14171a" text-anchor="start">System Context diagram for Atomanja</text></g>
<g class="subtitle"><text x="120" y="876" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">Who uses Atomanja and which other systems it depends on.</text></g>
<g class="key"><rect x="122" y="900" width="14" height="7" rx="3" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="129" cy="898" r="3" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="144" y="904" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">Person</text></g>
<g class="key"><rect x="197" y="895" width="18" height="12" rx="2" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="221" y="904" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">External</text></g>
<g class="key"><rect x="280" y="895" width="18" height="12" rx="2" fill="#1565c0" stroke="#0f488a" stroke-width="1"/><text x="304" y="904" font-family="Inter, sans-serif" font-size="11" fill="#5a6268" text-anchor="start">Software System</text></g>
