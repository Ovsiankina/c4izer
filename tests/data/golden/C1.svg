<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 40 1080 940" width="1080" height="940" xml:space="preserve">
<rect x="80" y="40" width="1080" height="940" fill="#ffffff"/>
<g class="line"><path d="M320,240 L360,240 L500,380 L500,410" fill="none" stroke="#1565c0" stroke-width="2" stroke-linejoin="round"/><path d="M500,410 L495,400 L505,400 Z" fill="#1565c0"/></g>
<g class="line"><path d="M620,260 L620,410" fill="none" stroke="#1565c0" stroke-width="2" stroke-linejoin="round"/><path d="M620,410 L615,400 L625,400 Z" fill="#1565c0"/></g>
<g class="line"><path d="M920,240 L880,240 L740,380 L740,410" fill="none" stroke="#1565c0" stroke-width="2" stroke-linejoin="round"/><path d="M740,410 L735,400 L745,400 Z" fill="#1565c0"/></g>
<g class="line"><path d="M620,550 L620,690" fill="none" stroke="#5d5a6b" stroke-width="2" stroke-linejoin="round"/><path d="M620,690 L615,680 L625,680 Z" fill="#5d5a6b"/></g>
<g class="box"><rect x="120" y="130" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="220" cy="110" r="30" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="220" y="168" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Worker</text><text x="220" y="183" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="220" y="203" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">The one person whose tasks are</text><text x="220" y="217" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tracked. Sees own tasks and</text><text x="220" y="231" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, marks debts as sent.</text></g>
<g class="box"><rect x="520" y="130" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="620" cy="110" r="30" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="620" y="168" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Witness</text><text x="620" y="183" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="620" y="203" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Accountability partner. Sees late</text><text x="620" y="217" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">tasks, claims debts, marks them</text><text x="620" y="231" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">received.</text></g>
<g class="box"><rect x="920" y="130" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="1020" cy="110" r="30" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="1020" y="175" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Admin witness</text><text x="1020" y="190" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Person]</text><text x="1020" y="210" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Maintainer. Troubleshoots the</text><text x="1020" y="224" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">witness view on fake data.</text></g>
<g class="box"><rect x="500" y="690" width="240" height="140" rx="6" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="620" y="740" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Vikunja</text><text x="620" y="755" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[External Software System]</text><text x="620" y="775" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Existing task manager. Source of tasks</text><text x="620" y="789" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">and deadlines. Never modified.</text></g>
<g class="box"><rect x="480" y="410" width="280" height="140" rx="6" fill="#1565c0" stroke="#0f488a" stroke-width="1"/><text x="620" y="460" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Atomanja</text><text x="620" y="475" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[Software System]</text><text x="620" y="495" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Records task deadlines, turns missed ones into</text><text x="620" y="509" font-family="Inter, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">debts, and tracks their settlement.</text></g>
<g class="label"><rect x="365" y="288" width="131" height="45" fill="#ffffff"/><text x="430" y="301" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">Views tasks and debts,</text><text x="430" y="314" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">marks debts sent,</text><text x="430" y="327" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">invites witnesses</text></g>
<g class="label"><rect x="553" y="308" width="134" height="45" fill="#ffffff"/><text x="620" y="321" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">Views late tasks, claims</text><text x="620" y="334" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">debts, marks debts</text><text x="620" y="347" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">received</text></g>
<g class="label"><rect x="750" y="288" width="120" height="45" fill="#ffffff"/><text x="810" y="301" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">Troubleshoots the</text><text x="810" y="314" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">witness view on fake</text><text x="810" y="327" font-family="Inter, sans-serif" font-size="11" fill="#0d3e77" text-anchor="middle">data</text></g>
<g class="label"><rect x="562" y="604" width="117" height="32" fill="#ffffff"/><text x="620" y="617" font-family="Inter, sans-serif" font-size="11" fill="#393742" text-anchor="middle">Polls tasks and</text><text x="620" y="630" font-family="Inter, sans-serif" font-size="11" fill="#393742" text-anchor="middle">deadlines, read-only</text></g>
<g class="title"><text x="120" y="877" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="start">System Context diagram for Atomanja</text></g>
<g class="subtitle"><text x="120" y="894" font-family="Inter, sans-serif" font-size="12" fill="#555555" text-anchor="start">Who uses Atomanja and which other systems it depends on.</text></g>
<g class="key"><rect x="123" y="926" width="20" height="10" rx="4" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><circle cx="133" cy="923" r="5" fill="#0b3c6f" stroke="#072b4f" stroke-width="1"/><text x="154" y="930" font-family="Inter, sans-serif" font-size="11" fill="#333333" text-anchor="start">Person</text></g>
<g class="key"><rect x="215" y="918" width="26" height="18" rx="3" fill="#5d5a6b" stroke="#42404d" stroke-width="1"/><text x="249" y="930" font-family="Inter, sans-serif" font-size="11" fill="#333333" text-anchor="start">External</text></g>
<g class="key"><rect x="316" y="918" width="26" height="18" rx="3" fill="#1565c0" stroke="#0f488a" stroke-width="1"/><text x="350" y="930" font-family="Inter, sans-serif" font-size="11" fill="#333333" text-anchor="start">Software System</text></g>
<g class="key"><path d="M463,927 L493,927" fill="none" stroke="#707070" stroke-width="2" stroke-linejoin="round"/><path d="M493,927 L483,932 L483,922 Z" fill="#707070"/><text x="501" y="930" font-family="Inter, sans-serif" font-size="11" fill="#333333" text-anchor="start">Relationship</text></g>
</svg>
