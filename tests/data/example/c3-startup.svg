<text x="30" y="40" font-size="22" fill="#111111" font-weight="bold" text-anchor="start">Component diagram for the Atomanja server: startup, settings and dev data</text>
<text x="30" y="62" font-size="13" fill="#555555" font-weight="normal" text-anchor="start">What cli starts, who reads config, and what devdata seeds. Only lines touching those three are drawn here.</text>
