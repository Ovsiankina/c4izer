<rect x="950" y="140" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="1050" y="175" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">cli</text><text x="1050" y="190" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust binary]</text><text x="1050" y="210" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Command line: serve, create</text><text x="1050" y="224" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">accounts, generate push</text><text x="1050" y="238" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">keys, seed dev data.</text>
<rect x="100" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="200" y="462" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">sync</text><text x="200" y="477" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, tokio]</text><text x="200" y="497" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Poll loop: fetch, apply to</text><text x="200" y="511" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">ledger, persist, notify.</text>
<rect x="440" y="420" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4"/><text x="540" y="455" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">notify</text><text x="540" y="470" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, Web Push]</text><text x="540" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Turns ledger changes into</text><text x="540" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">push notifications. Owns the</text><text x="540" y="518" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">push keys.</text>
<rect x="780" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="880" y="455" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">web</text><text x="880" y="470" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, axum, htmx]</text><text x="880" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">HTTP layer: both views,</text><text x="880" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">login flows, debt actions,</text><text x="880" y="518" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">push subscription.</text>
<rect x="1120" y="420" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24"/><text x="1220" y="455" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">auth</text><text x="1220" y="470" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1220" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Pure account rules: roles,</text><text x="1220" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">password hashing, tokens,</text><text x="1220" y="518" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">permission checks.</text>
<rect x="1460" y="420" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4"/><text x="1560" y="455" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">store</text><text x="1560" y="470" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, SQLite]</text><text x="1560" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Persistence for ledger and</text><text x="1560" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">dev databases. Ledger is</text><text x="1560" y="518" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">insert-only.</text>
<rect x="1800" y="420" width="200" height="120" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="1900" y="455" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">devdata</text><text x="1900" y="470" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1900" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Fills the dev database with</text><text x="1900" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">fake data through the real</text><text x="1900" y="518" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">ledger rules.</text>
<rect x="100" y="700" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4"/><text x="200" y="735" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">vikunja</text><text x="200" y="750" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, HTTP client]</text><text x="200" y="770" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Read-only Vikunja client.</text><text x="200" y="784" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Maps tasks to snapshot</text><text x="200" y="798" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">records.</text>
<rect x="440" y="700" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24"/><text x="540" y="735" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">config</text><text x="540" y="750" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="540" y="770" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Loads every setting from</text><text x="540" y="784" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">environment variables at</text><text x="540" y="798" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">startup.</text>
<rect x="780" y="700" width="200" height="120" rx="6" fill="#1e88e5" stroke="#1561a4"/><text x="880" y="742" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">mail</text><text x="880" y="757" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust, SMTP client]</text><text x="880" y="777" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Sends invite and</text><text x="880" y="791" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">password-reset emails.</text>
<rect x="1800" y="700" width="200" height="120" rx="6" fill="#2e7d32" stroke="#215a24"/><text x="1900" y="728" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">ledger</text><text x="1900" y="743" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1900" y="763" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Pure domain rules:</text><text x="1900" y="777" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">deadlines, met or late,</text><text x="1900" y="791" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">debts, claims, marks,</text><text x="1900" y="805" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">amount.</text>
