<text x="1000" y="401" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">data</text>
<text x="1000" y="414" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">[HTTPS]</text>
<rect x="721" y="361" width="159" height="58" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="800" y="375" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">Views late tasks, claims</text>
<text x="800" y="388" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">debts, marks debts</text>
<text x="800" y="401" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">received</text>
<text x="800" y="414" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">[HTTPS]</text>
<rect x="527" y="361" width="146" height="58" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="600" y="375" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">Views tasks and debts,</text>
<text x="600" y="388" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">marks debts sent,</text>
<text x="600" y="401" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">invites witnesses</text>
<text x="600" y="414" font-size="11" fill="#12548d" font-weight="normal" text-anchor="middle">[HTTPS]</text>
<rect x="257" y="214" width="146" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="330" y="228" font-size="11" fill="#062544" font-weight="normal" text-anchor="middle">Delivers notifications</text>
<text x="330" y="241" font-size="11" fill="#062544" font-weight="normal" text-anchor="middle">to</text>
