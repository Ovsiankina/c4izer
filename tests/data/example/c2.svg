<text x="420" y="652" font-size="11" fill="#393742" font-weight="normal" text-anchor="middle">Polls tasks and</text>
<text x="420" y="664" font-size="11" fill="#393742" font-weight="normal" text-anchor="middle">deadlines, read-only</text>
<text x="420" y="678" font-size="11" fill="#393742" font-weight="normal" text-anchor="middle">[HTTPS/JSON]</text>
