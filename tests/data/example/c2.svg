<rect x="50" y="160" width="200" height="140" rx="6" fill="#5d5a6b" stroke="#42404d"/><text x="150" y="205" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Push services</text><text x="150" y="220" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[External Software System]</text><text x="150" y="240" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Browser vendors&#x27; endpoints</text><text x="150" y="254" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">that deliver notifications</text><text x="150" y="268" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">to installed apps.</text>
<rect x="420" y="190" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f"/><circle cx="520.0" cy="170" r="30" fill="#0b3c6f" stroke="#072b4f"/><text x="520" y="223" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Worker</text><text x="520" y="238" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Person]</text><text x="520" y="258" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">The one person whose tasks</text><text x="520" y="272" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">are tracked. Sees own tasks</text><text x="520" y="286" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">and debts, marks debts as</text><text x="520" y="300" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">sent.</text>
<rect x="700" y="190" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f"/><circle cx="800.0" cy="170" r="30" fill="#0b3c6f" stroke="#072b4f"/><text x="800" y="230" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Witness</text><text x="800" y="245" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Person]</text><text x="800" y="265" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Accountability partner. Sees</text><text x="800" y="279" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">late tasks, claims debts,</text><text x="800" y="293" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">marks them received.</text>
<rect x="980" y="190" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f"/><circle cx="1080.0" cy="170" r="30" fill="#0b3c6f" stroke="#072b4f"/><text x="1080" y="230" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Admin witness</text><text x="1080" y="245" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Person]</text><text x="1080" y="265" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Maintainer. Troubleshoots</text><text x="1080" y="279" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">the witness view on fake</text><text x="1080" y="293" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">data.</text>
<rect x="580" y="470" width="440" height="140" rx="6" fill="#1e88e5" stroke="#1561a4"/><text x="800" y="522" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Atomanja server</text><text x="800" y="537" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: Rust, axum, HTML + htmx]</text><text x="800" y="557" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Single binary. Polls Vikunja, keeps the ledger, serves both</text><text x="800" y="571" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">views, sends notifications and emails.</text>
<path d="M560,722 a100.0,12 0 0 1 200,0 v116 a100.0,12 0 0 1 -200,0 z" fill="#00796b" stroke="#00574d"/><path d="M560,722 a100.0,12 0 0 0 200,0" fill="none" stroke="#00574d"/><text x="660" y="761" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Ledger database</text><text x="660" y="776" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: SQLite file]</text><text x="660" y="796" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Append-only record of</text><text x="660" y="810" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">deadlines, debts, claims,</text><text x="660" y="824" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">marks and accounts.</text>
<path d="M840,722 a100.0,12 0 0 1 200,0 v116 a100.0,12 0 0 1 -200,0 z" fill="#00796b" stroke="#00574d"/><path d="M840,722 a100.0,12 0 0 0 200,0" fill="none" stroke="#00574d"/><text x="940" y="761" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Dev database</text><text x="940" y="776" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: SQLite file]</text><text x="940" y="796" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Fake tasks and debts for the</text><text x="940" y="810" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">admin witness. Isolated from</text><text x="940" y="824" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">the real ledger.</text>
<rect x="50" y="710" width="200" height="140" rx="6" fill="#5d5a6b" stroke="#42404d"/><text x="150" y="755" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Vikunja</text><text x="150" y="770" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[External Software System]</text><text x="150" y="790" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Existing task manager.</text><text x="150" y="804" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Source of tasks and</text><text x="150" y="818" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">deadlines. Never modified.</text>
<rect x="1300" y="710" width="220" height="140" rx="6" fill="#5d5a6b" stroke="#42404d"/><text x="1410" y="762" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Mail server</text><text x="1410" y="777" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[External Software System]</text><text x="1410" y="797" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Delivers invite and</text><text x="1410" y="811" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">password-reset emails.</text>
