<text x="30" y="40" font-size="22" fill="#111111" font-weight="bold" text-anchor="start">Container diagram for Atomanja</text>
<text x="30" y="62" font-size="13" fill="#555555" font-weight="normal" text-anchor="start">The running parts of Atomanja and the technology each one uses.</text>
