<rect x="460" y="100" width="240" height="140" rx="6" fill="#5d5a6b" stroke="#42404d"/><text x="580" y="145" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Text editor</text><text x="580" y="160" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[External Software System]</text><text x="580" y="180" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Whatever editor the architect</text><text x="580" y="194" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">already uses for the diagram file.</text><text x="580" y="208" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Half of hot reload.</text>
<rect x="860" y="130" width="200" height="130" rx="22" fill="#0b3c6f" stroke="#072b4f"/><circle cx="960.0" cy="110" r="30" fill="#0b3c6f" stroke="#072b4f"/><text x="960" y="163" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Coding agent</text><text x="960" y="178" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Person]</text><text x="960" y="198" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Edits the model and renders</text><text x="960" y="212" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">and lints diagrams from the</text><text x="960" y="226" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">command line, without a</text><text x="960" y="240" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">screen.</text>
<rect x="80" y="390" width="240" height="140" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="200" y="435" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">c4rizer editor</text><text x="200" y="450" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: Rust, egui]</text><text x="200" y="470" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Desktop canvas: reloads on save,</text><text x="200" y="484" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">drag boxes with live re-routing,</text><text x="200" y="498" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">edit text in place.</text>
<path d="M460,402 a120.0,12 0 0 1 240,0 v116 a120.0,12 0 0 1 -240,0 z" fill="#00796b" stroke="#00574d"/><path d="M460,402 a120.0,12 0 0 0 240,0" fill="none" stroke="#00574d"/><text x="580" y="441" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Diagram file</text><text x="580" y="456" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: c4rizer DSL]</text><text x="580" y="476" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Single source of truth: elements,</text><text x="580" y="490" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">relationships, styles, views and</text><text x="580" y="504" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">box positions.</text>
<rect x="840" y="390" width="240" height="140" rx="6" fill="#c2410c" stroke="#8b2e08"/><text x="960" y="435" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">c4rizer CLI</text><text x="960" y="450" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: Rust binary]</text><text x="960" y="470" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Exports views to SVG and PNG and</text><text x="960" y="484" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">lints them with an exit code, for</text><text x="960" y="498" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">scripts and agents.</text>
<path d="M460,662 a120.0,12 0 0 1 240,0 v116 a120.0,12 0 0 1 -240,0 z" fill="#00796b" stroke="#00574d"/><path d="M460,662 a120.0,12 0 0 0 240,0" fill="none" stroke="#00574d"/><text x="580" y="708" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Diagram exports</text><text x="580" y="723" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: SVG, PNG]</text><text x="580" y="743" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Rendered views for docs and</text><text x="580" y="757" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">reviews.</text>
<rect x="460" y="910" width="240" height="140" rx="6" fill="#2e7d32" stroke="#215a24"/><text x="580" y="948" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">c4rizer core</text><text x="580" y="963" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Container: Rust library]</text><text x="580" y="983" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Parses, places, routes and lints;</text><text x="580" y="997" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">builds a scene per view; turns</text><text x="580" y="1011" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">scenes into SVG and PNG. No UI, no</text><text x="580" y="1025" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">file I/O.</text>
