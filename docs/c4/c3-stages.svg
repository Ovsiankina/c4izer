<rect x="100" y="110" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="200" y="145" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">place</text><text x="200" y="160" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="200" y="180" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Gives every unplaced box a</text><text x="200" y="194" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">grid position without moving</text><text x="200" y="208" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">placed ones.</text>
<rect x="440" y="110" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="540" y="145" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">route</text><text x="540" y="160" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="540" y="180" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Octilinear grid router: bus</text><text x="540" y="194" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">lanes, joins, fewest</text><text x="540" y="208" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">crossings, rip-up and retry.</text>
<rect x="780" y="110" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="880" y="152" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">label</text><text x="880" y="167" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="880" y="187" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Places each line label clear</text><text x="880" y="201" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">of boxes, labels and lines.</text>
<rect x="1120" y="110" width="200" height="120" rx="6" fill="#00838f" stroke="#005e66"/><text x="1220" y="138" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">scene</text><text x="1220" y="153" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1220" y="173" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Builds the plain-data</text><text x="1220" y="187" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">picture of a view, every</text><text x="1220" y="201" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">item tagged with its model</text><text x="1220" y="215" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">id.</text>
<rect x="1460" y="110" width="200" height="120" rx="6" fill="#00838f" stroke="#005e66"/><text x="1560" y="152" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">export</text><text x="1560" y="167" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1560" y="187" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Writes a scene as SVG text</text><text x="1560" y="201" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">or PNG bytes.</text>
<rect x="440" y="370" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="540" y="405" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">view</text><text x="540" y="420" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="540" y="440" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Resolves a view spec into</text><text x="540" y="454" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">boxes and edges: include,</text><text x="540" y="468" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">exclude, lifting, focus.</text>
<rect x="440" y="630" width="200" height="120" rx="6" fill="#6a1b9a" stroke="#4c136e"/><text x="540" y="665" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">model</text><text x="540" y="680" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="540" y="700" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Elements, relationships,</text><text x="540" y="714" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">styles and view specs, each</text><text x="540" y="728" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">with its source span.</text>
<rect x="100" y="630" width="200" height="120" rx="6" fill="#6a1b9a" stroke="#4c136e"/><text x="200" y="665" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">text</text><text x="200" y="680" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="200" y="700" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Lossless lexer and syntax</text><text x="200" y="714" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">tree; printing gives the</text><text x="200" y="728" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">input back.</text>
<rect x="100" y="890" width="200" height="120" rx="6" fill="#6a1b9a" stroke="#4c136e"/><text x="200" y="925" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">edit</text><text x="200" y="940" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="200" y="960" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Turns moves, resizes, text</text><text x="200" y="974" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">and style edits into byte</text><text x="200" y="988" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">patches on the file.</text>
<rect x="1120" y="630" width="200" height="120" rx="6" fill="#00838f" stroke="#005e66"/><text x="1220" y="665" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">lint</text><text x="1220" y="680" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1220" y="700" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Checks a scene against the</text><text x="1220" y="714" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">C4 rules and the crossing</text><text x="1220" y="728" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">budget.</text>
