<rect x="100" y="370" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="200" y="405" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">view</text><text x="200" y="420" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="200" y="440" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Resolves a view spec into</text><text x="200" y="454" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">boxes and edges: include,</text><text x="200" y="468" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">exclude, lifting, focus.</text>
<rect x="440" y="370" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="540" y="405" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">place</text><text x="540" y="420" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="540" y="440" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Gives every unplaced box a</text><text x="540" y="454" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">grid position without moving</text><text x="540" y="468" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">placed ones.</text>
<rect x="780" y="370" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="880" y="405" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">route</text><text x="880" y="420" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="880" y="440" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Octilinear grid router: bus</text><text x="880" y="454" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">lanes, joins, fewest</text><text x="880" y="468" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">crossings, rip-up and retry.</text>
<rect x="1120" y="370" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="1220" y="412" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">label</text><text x="1220" y="427" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1220" y="447" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Places each line label clear</text><text x="1220" y="461" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">of boxes, labels and lines.</text>
<rect x="1460" y="370" width="200" height="120" rx="6" fill="#00838f" stroke="#005e66"/><text x="1560" y="398" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">scene</text><text x="1560" y="413" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="1560" y="433" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Builds the plain-data</text><text x="1560" y="447" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">picture of a view, every</text><text x="1560" y="461" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">item tagged with its model</text><text x="1560" y="475" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">id.</text>
<rect x="780" y="630" width="200" height="120" rx="6" fill="#1565c0" stroke="#0f488a"/><text x="880" y="665" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">geom</text><text x="880" y="680" font-size="10.5" fill="#ffffff" font-weight="normal" text-anchor="middle">[Component: Rust module]</text><text x="880" y="700" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">Grid units, points, rects,</text><text x="880" y="714" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">octilinear segments and</text><text x="880" y="728" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="middle">crossing tests.</text>
<rect x="832" y="534" width="97" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="880" y="548" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">Walks the grid</text>
<text x="880" y="561" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">of</text>
<rect x="982" y="514" width="97" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="1030" y="528" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">Tests overlaps</text>
<text x="1030" y="541" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">with</text>
<rect x="678" y="514" width="103" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="730" y="528" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">Snaps positions</text>
<text x="730" y="541" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">to the grid of</text>
<rect x="1185" y="634" width="91" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="1230" y="648" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">Converts grid</text>
<text x="1230" y="661" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">units with</text>
<rect x="482" y="634" width="97" height="32" rx="3" fill="#ffffff" fill-opacity="0.93"/>
<text x="530" y="648" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">Sizes boxes on</text>
<text x="530" y="661" font-size="11" fill="#0d3e77" font-weight="normal" text-anchor="middle">the grid of</text>
