<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 946" width="1720" height="946" font-family="Helvetica, Arial, sans-serif">
<rect width="1720" height="946" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#111111" font-weight="bold" text-anchor="start">Component diagram for c4rizer core: geometry</text>
<text x="30" y="62" font-size="13" fill="#555555" font-weight="normal" text-anchor="start">The shared grid geometry and the stages that use it.</text>
<defs>
